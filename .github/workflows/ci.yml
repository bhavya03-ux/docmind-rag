name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests need only the light dependencies (no Ollama / Chroma / Streamlit).
      - run: pip install pypdf langchain-text-splitters pytest
      - run: pytest -q
      - run: python -m docmind.cli --backend memory eval
